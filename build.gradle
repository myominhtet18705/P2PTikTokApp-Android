// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

plugins {
    id 'com.chaquo.python' version '16.1.0' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
