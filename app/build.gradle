plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.p2p.offlinetiktok'
    compileSdk 34

    defaultConfig {
        applicationId "com.p2p.offlinetiktok"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.3"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

// Chaquopy configuration
chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            install("flask")
            install("requests")
        }
        extractPackages("flask", "werkzeug", "jinja2", "markupsafe", "itsdangerous", "click", "blinker", "certifi", "charset-normalizer", "idna", "urllib3")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
